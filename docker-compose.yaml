networks:
  test_network:
    driver: bridge

volumes:
  postgres_data:
  # prometheus_data:
  # grafana_data:
  # loki_data:
  # tempo_data:

services:
  api:
    container_name: api
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://todo_admin:todo_pass@db:5432/todos
      # OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      # OTEL_SERVICE_NAME: todo-api
    volumes:
      - ./app:/app/app
      - ./docs:/app/docs
    ports:
      - "8000:8000"
    networks:
      - test_network
    depends_on:
      db:
        condition: service_healthy
      # otel-collector:
      #   condition: service_started
    env_file: .env
    restart: unless-stopped

  db:
    container_name: db
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: todo_admin
      POSTGRES_PASSWORD: todo_pass
      POSTGRES_DB: todos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_admin -d todos"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

