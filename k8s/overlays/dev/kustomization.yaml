apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Secrets are SOPS-encrypted in secrets/ and applied out-of-band
# (make k8s-secrets, Tilt, or Pulumi), never rendered by Kustomize.
resources:
  - ../../base/traefik
  - ../../base/postgres
  - ../../base/app
  - ../../base/monitoring

patches:
  # *.localhost resolves to 127.0.0.1, reached through `minikube tunnel`.
  - target:
      kind: Ingress
      name: todo-api
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: todo.localhost

  - target:
      kind: Ingress
      name: grafana
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: grafana.localhost

  - target:
      kind: Ingress
      name: prometheus
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: prometheus.localhost

  - target:
      kind: Ingress
      name: alloy
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: alloy.localhost

  - target:
      kind: Ingress
      name: traefik-dashboard
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: traefik.localhost
