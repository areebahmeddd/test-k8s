apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/app
  - ../../base/postgres
  - ../../base/monitoring
  - ../../base/traefik
  - hpa-todo-api.yaml
  # Secrets are excluded here — applied separately via: sops -d <file> | kubectl apply -f -
  # - secrets/todo-api-secret.yaml
  # - secrets/todo-db-secret.yaml
  # - secrets/grafana-secret.yaml
  # - secrets/alertmanager-secret.yaml

patches:
  - path: postgres-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: todo-db

  - path: pooler-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Pooler
      name: todo-db-pooler

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: todo.1mindlabs.org
    target:
      kind: Ingress
      name: todo-api

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: grafana.1mindlabs.org
    target:
      kind: Ingress
      name: grafana

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: prometheus.1mindlabs.org
    target:
      kind: Ingress
      name: prometheus

  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: traefik.1mindlabs.org
    target:
      kind: Ingress
      name: traefik-dashboard

  # TODO: add host patch for alloy ingress (alloy.1mindlabs.org or similar) and
  # add TLS + auth middleware patches for all internal-tool ingresses (prometheus,
  # alloy, traefik-dashboard) once cert-manager and a ClusterIssuer are in place.
