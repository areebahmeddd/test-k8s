apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Secrets are SOPS-encrypted in secrets/ and applied out-of-band
# (make k8s-secrets or Pulumi), never rendered by Kustomize.
resources:
  - ../../base/traefik
  - ../../base/postgres
  - ../../base/app
  - ../../base/monitoring
  - hpa-todo-api.yaml

patches:
  - path: postgres-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: todo-db

  - path: pooler-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Pooler
      name: todo-db-pooler

  # HPA owns the replica count.
  - target:
      kind: Deployment
      name: todo-api
    patch: |-
      - op: remove
        path: /spec/replicas

  # Lab setup: plain HTTP. Add TLS (cert-manager) and auth middleware before real use.
  - target:
      kind: Ingress
      name: todo-api
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: todo.1mindlabs.org

  - target:
      kind: Ingress
      name: grafana
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: grafana.1mindlabs.org

  - target:
      kind: Ingress
      name: prometheus
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: prometheus.1mindlabs.org

  - target:
      kind: Ingress
      name: alloy
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: alloy.1mindlabs.org

  - target:
      kind: Ingress
      name: traefik-dashboard
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: traefik.1mindlabs.org
