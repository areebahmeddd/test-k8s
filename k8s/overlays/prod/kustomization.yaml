apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/traefik
  - ../../base/postgres
  - ../../base/app
  - ../../base/monitoring
  - hpa-todo-api.yaml
  # Internal-tool ingresses — excluded from base to avoid host-less routing conflicts in dev.
  - ../../base/traefik/dashboard-ingress.yaml
  - ../../base/monitoring/alloy/ingress.yaml
  - ../../base/monitoring/prometheus/ingress.yaml
  - ../../base/monitoring/grafana/ingress.yaml
  # Secrets are excluded here — applied separately via: sops -d <file> | kubectl apply -f -
  # - secrets/todo-api-secret.yaml
  # - secrets/todo-db-secret.yaml
  # - secrets/grafana-secret.yaml
  # - secrets/alertmanager-secret.yaml

patches:
  # Database
  - path: postgres-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: todo-db

  - path: pooler-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Pooler
      name: todo-db-pooler

  # Ingress hosts
  - patch: |-
      - op: add
        path: /spec/rules/0/host
        value: todo.1mindlabs.org
    target:
      kind: Ingress
      name: todo-api

  - patch: |-
      - op: add
        path: /spec/rules/0/host
        value: grafana.1mindlabs.org
    target:
      kind: Ingress
      name: grafana

  - patch: |-
      - op: add
        path: /spec/rules/0/host
        value: prometheus.1mindlabs.org
    target:
      kind: Ingress
      name: prometheus

  - patch: |-
      - op: add
        path: /spec/rules/0/host
        value: alloy.1mindlabs.org
    target:
      kind: Ingress
      name: alloy

  - patch: |-
      - op: add
        path: /spec/rules/0/host
        value: traefik.1mindlabs.org
    target:
      kind: Ingress
      name: traefik-dashboard

  # TODO: add TLS + auth middleware patches for all internal-tool ingresses
  # (prometheus, alloy, traefik-dashboard) once cert-manager and a ClusterIssuer are in place.
