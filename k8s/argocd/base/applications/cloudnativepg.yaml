apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnativepg
  labels:
    app.kubernetes.io/name: cloudnativepg
    app.kubernetes.io/instance: cloudnativepg
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
  # Deleting the Application also deletes the resources it manages.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: "0.29.1" # operator 1.30.1
    helm:
      releaseName: cloudnative-pg
      valuesObject:
        replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
