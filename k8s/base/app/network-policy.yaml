apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# ingress: traefik (8000), prometheus scrape (8000)
# egress:  dns (53), pgbouncer (5432), alloy otlp grpc (4317)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-todo-api
  labels:
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: todo-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8000
    # prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # pgbouncer
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: todo-db-pooler
      ports:
        - protocol: TCP
          port: 5432
    # alloy
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 4317

---
# ingress: todo-api (5432)
# egress:  dns (53), postgres primary (5432), k8s api (443/8443)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer
  labels:
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: todo-db-pooler
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # todo-api
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: todo-api
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # postgres
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: todo-db
      ports:
        - protocol: TCP
          port: 5432
    # k8s api - cnpg pgbouncer instance manager watches pooler/secret resources
    - to:
        - ipBlock:
            cidr: 10.96.0.0/12
        - ipBlock:
            cidr: 192.168.49.2/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443

---
# ingress: pgbouncer (5432), peer replication (5432), cnpg operator (5432, 8000)
# egress:  dns (53), peer replication (5432), k8s api (443)
#
# cnpg instance manager contacts the k8s api to read secrets and update
# Cluster status. ha replication rules apply when patched to 3 instances in prod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  labels:
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: todo-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # pgbouncer
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: todo-db-pooler
      ports:
        - protocol: TCP
          port: 5432
    # peer replication
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: todo-db
      ports:
        - protocol: TCP
          port: 5432
    # cnpg operator - 5432 for admin queries, 8000 for instance manager status probe
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
  egress:
    # dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # peer replication
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: todo-db
      ports:
        - protocol: TCP
          port: 5432
    # k8s api - CNPG instance manager reads secrets/updates Cluster status
    - to:
        - ipBlock:
            cidr: 10.96.0.0/12
        - ipBlock:
            cidr: 192.168.49.2/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
