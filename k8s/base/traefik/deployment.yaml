apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/version: "3.6.13"
    app.kubernetes.io/component: ingress-controller
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
spec:
  # TODO: increase to at least 2 replicas for ingress-controller HA.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0 # hostPort requires old pod to leave before new one schedules
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik
        app.kubernetes.io/version: "3.6.13"
        app.kubernetes.io/component: ingress-controller
        app.kubernetes.io/part-of: todo-k8s
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: traefik
      nodeSelector:
        ingress-ready: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: traefik
          image: traefik:v3.6.13
          imagePullPolicy: IfNotPresent
          args:
            # Entrypoints
            - --entrypoints.web.address=:80
            - --entrypoints.traefik.address=:9000
            # Providers
            - --providers.kubernetesingress
            - --providers.kubernetesingress.ingressclass=traefik
            # API & Dashboard
            - --api.dashboard=true
            # TODO: remove --api.insecure — use a Traefik middleware with
            # basic-auth or OAuth instead, or restrict the dashboard ingress to internal IPs only.
            - --api.insecure=true
            # Health check endpoint served on traefik entrypoint
            - --ping
            - --ping.entrypoint=traefik
            - --log.level=info
          ports:
            - name: web
              containerPort: 80
              hostPort: 80
              protocol: TCP
            - name: dashboard
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: dashboard
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: dashboard
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]  # required to bind :80 as non-root
