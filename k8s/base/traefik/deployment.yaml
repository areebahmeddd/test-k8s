apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/version: "3.6"
    app.kubernetes.io/component: ingress-controller
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  # TODO: increase to at least 2 replicas in prod for ingress-controller HA
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik
        app.kubernetes.io/version: "3.6"
        app.kubernetes.io/component: ingress-controller
        app.kubernetes.io/part-of: todo-k8s
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.6
          args:
            # Entrypoints
            - --entrypoints.web.address=:80
            # Providers
            - --providers.kubernetesingress
            - --providers.kubernetesingress.ingressclass=traefik
            # API & Dashboard
            - --api.dashboard=true
            # TODO: remove --api.insecure in prod — use a Traefik middleware with
            # basic-auth or OAuth instead, or restrict the dashboard ingress to internal IPs only.
            - --api.insecure=true
            - --entrypoints.traefik.address=:9000
            # Health check endpoint served on traefik entrypoint
            - --ping
            - --ping.entrypoint=traefik
            - --log.level=info
          ports:
            - name: web
              containerPort: 80
              protocol: TCP
            - name: dashboard
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: dashboard
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: dashboard
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
