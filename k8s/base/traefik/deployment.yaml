apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/version: "3.7.16"
    app.kubernetes.io/component: ingress-controller
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik
        app.kubernetes.io/version: "3.7.16"
        app.kubernetes.io/component: ingress-controller
        app.kubernetes.io/part-of: todo-k8s
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: traefik
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.7.16
          imagePullPolicy: IfNotPresent
          args:
            # Unprivileged ports; the LoadBalancer Service maps 80 -> 8000.
            - --entrypoints.web.address=:8000
            - --entrypoints.traefik.address=:9000
            - --providers.kubernetesingress
            - --providers.kubernetesingress.ingressclass=traefik
            # Lab setup: the dashboard is unauthenticated (served on :9000 and
            # via the traefik-dashboard Ingress). Add auth before exposing it.
            - --api.dashboard=true
            - --api.insecure=true
            - --ping
            - --ping.entrypoint=traefik
            - --log.level=info
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
          ports:
            - name: web
              containerPort: 8000
              protocol: TCP
            - name: dashboard
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: dashboard
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: dashboard
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
