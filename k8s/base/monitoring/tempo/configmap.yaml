apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: tempo
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
data:
  # Tempo 3 single-binary mode: the distributor writes straight to the live-store
  # (no Kafka), which flushes blocks to local storage.
  tempo.yaml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      log_level: warn

    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/blocks
        wal:
          path: /var/tempo/wal

    usage_report:
      reporting_enabled: false
