apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      # One target per todo-api pod (scraping the Service would hit a random replica).
      - job_name: todo-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [todo-app]
            selectors:
              - role: pod
                label: app.kubernetes.io/name=todo-api
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  # Metric names come from prometheus-fastapi-instrumentator: http_requests_total
  # carries status (grouped as 2xx/4xx/5xx); http_request_duration_seconds does not.
  alert-rules.yml: |
    groups:
      - name: todo-api
        rules:
          - alert: APIDown
            expr: up{job="todo-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Todo API pod {{ $labels.pod }} is down"
              description: "Prometheus has been unable to scrape {{ $labels.pod }} for more than 1 minute."

          - alert: HighErrorRate
            expr: |
              sum(rate(http_requests_total{job="todo-api", status="5xx"}[5m]))
              /
              sum(rate(http_requests_total{job="todo-api"}[5m])) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High HTTP 5xx error rate"
              description: "More than 5% of requests returned 5xx over the last 5 minutes."

          - alert: SlowP99Latency
            expr: |
              histogram_quantile(0.99,
                sum by (handler, le) (rate(http_request_duration_seconds_bucket{job="todo-api"}[5m]))
              ) > 1
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Slow p99 latency on {{ $labels.handler }}"
              description: "p99 latency on {{ $labels.handler }} has exceeded 1s for 3 minutes (current: {{ $value | humanizeDuration }})."
