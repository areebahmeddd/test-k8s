apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        isDefault: true
        editable: false

      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
        editable: false

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo:3200
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
          tracesToMetrics:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        url: http://alertmanager:9093
        editable: false
        jsonData:
          implementation: prometheus
