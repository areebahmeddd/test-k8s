apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
data:
  config.alloy: |
    // Discover all Kubernetes pods in the cluster.
    // loki.source.kubernetes uses the K8s API — no node filesystem access required.
    discovery.kubernetes "pod" {
      role = "pod"
    }

    // Relabel pod metadata into useful Loki stream labels.
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pod.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        action        = "replace"
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        action        = "replace"
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        action        = "replace"
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        action        = "replace"
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        action        = "replace"
        target_label  = "job"
        separator     = "/"
        replacement   = "$1"
      }
    }

    // Stream logs from pods via the Kubernetes API and forward to Loki.
    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.loki.receiver]
    }

    // Write log entries to Loki.
    loki.write "loki" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
