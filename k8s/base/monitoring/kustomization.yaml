apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - network-policy.yaml
  - alloy/serviceaccount.yaml
  - alloy/clusterrole.yaml
  - alloy/clusterrolebinding.yaml
  - alloy/configmap.yaml
  - alloy/deployment.yaml
  - alloy/service.yaml
  - alloy/ingress.yaml
  - loki/configmap.yaml
  - loki/deployment.yaml
  - loki/service.yaml
  - tempo/configmap.yaml
  - tempo/deployment.yaml
  - tempo/service.yaml
  - prometheus/rbac.yaml
  - prometheus/configmap.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - prometheus/ingress.yaml
  - alertmanager/deployment.yaml
  - alertmanager/service.yaml
  - grafana/configmap-datasources.yaml
  - grafana/configmap-provisioning.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  - grafana/ingress.yaml

configMapGenerator:
  - name: grafana-dashboards
    options:
      disableNameSuffixHash: true
    files:
      - api-metrics.json=grafana/dashboards/api-metrics.json
