# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: todo-db
  labels:
    app.kubernetes.io/name: todo-db
    app.kubernetes.io/instance: todo-db
    app.kubernetes.io/version: "18.6"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: todo-k8s
    app.kubernetes.io/managed-by: kustomize
spec:
  # prod overlay: 3 instances
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  imagePullPolicy: IfNotPresent
  # todo-db-secret holds the owner username and password (also used by todo-api).
  bootstrap:
    initdb:
      database: todos
      owner: admin
      secret:
        name: todo-db-secret
      dataChecksums: true
      encoding: UTF8
  # prod overlay: 50Gi data / 5Gi WAL
  storage:
    size: 5Gi
  walStorage:
    size: 1Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  replicationSlots:
    highAvailability:
      enabled: true
  # prod overlay: true
  enablePDB: false
  logLevel: info
