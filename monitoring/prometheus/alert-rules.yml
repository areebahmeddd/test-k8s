groups:
  - name: todo-api
    rules:
      - alert: APIDown
        expr: up{job="todo-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Todo API is down"
          description: "Prometheus has been unable to scrape the todo-api for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{status=~"5.*"}[5m]))
          /
          sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of all requests are returning 5xx errors over the last 5 minutes."

      - alert: SlowP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (handler, le)
          ) > 1.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow p99 response latency on {{ $labels.handler }}"
          description: "p99 response time on {{ $labels.handler }} has exceeded 1s for more than 3 minutes (current: {{ $value | humanizeDuration }})."
