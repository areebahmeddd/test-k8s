name: Validate manifests

on:
  push:
    branches: [dev, prod]
    paths: ["k8s/**", "policy/**", ".sops.yaml", "Makefile", ".github/workflows/validate.yaml"]
  pull_request:
    branches: [dev, prod]
    paths: ["k8s/**", "policy/**", ".sops.yaml", "Makefile", ".github/workflows/validate.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: "v5.8.3"
  KUBECONFORM_VERSION: "v0.8.0"
  CONFTEST_VERSION: "0.71.1"

jobs:
  validate:
    name: Validate manifests and policies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kustomize, kubeconform and conftest
        run: |
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kustomize
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kubeconform
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin conftest

      - name: Build every kustomization
        run: make validate-k8s

      - name: Validate against Kubernetes and CRD schemas
        run: make validate-schema

      - name: Check that all secrets are SOPS-encrypted
        run: make validate-sops

      - name: Test and apply the OPA policies
        run: make validate-policies
