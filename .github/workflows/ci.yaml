name: Code Quality and Testing

on:
  push:
    branches: [dev, prod]
    paths-ignore: ["**.md", "docs/**", "k8s/**", "policy/**"]
  pull_request:
    branches: [dev, prod]
    paths-ignore: ["**.md", "docs/**", "k8s/**", "policy/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Check that migrations match the models
        env:
          SECRET_KEY: ci-only-secret-key-not-used-for-anything-real
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: uv run alembic upgrade head && uv run alembic check

      - name: Run tests with coverage
        run: uv run pytest -v --cov=app --cov-report=term-missing

  docker-build:
    name: Build the Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t todo-api:ci .
