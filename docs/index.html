<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Source+Sans+3:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="auth-view">
      <div class="auth-card">
        <h1>Todo</h1>
        <p class="subtitle">Sign in to manage your tasks</p>

        <div class="tabs">
          <button
            class="tab-btn active"
            id="tab-login"
            onclick="switchTab('login')"
          >
            Login
          </button>
          <button
            class="tab-btn"
            id="tab-register"
            onclick="switchTab('register')"
          >
            Register
          </button>
        </div>

        <div id="login-form">
          <div class="field">
            <label for="login-username">Username</label>
            <input
              id="login-username"
              type="text"
              placeholder="username"
              autocomplete="username"
            />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>
          <button class="btn btn-primary" id="login-btn" onclick="doLogin()">
            Sign in
          </button>
          <p class="err" id="login-err"></p>
        </div>

        <div id="register-form" class="hidden">
          <div class="field">
            <label for="reg-email">Email</label>
            <input
              id="reg-email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
          <div class="field">
            <label for="reg-username">Username</label>
            <input
              id="reg-username"
              type="text"
              placeholder="username"
              autocomplete="username"
            />
          </div>
          <div class="field">
            <label for="reg-password">Password</label>
            <input
              id="reg-password"
              type="password"
              placeholder="••••••••"
              autocomplete="new-password"
            />
          </div>
          <button
            class="btn btn-primary"
            id="register-btn"
            onclick="doRegister()"
          >
            Create account
          </button>
          <p class="err" id="register-err"></p>
        </div>
      </div>
    </div>

    <div id="app-view" class="hidden">
      <div class="app-card">
        <div class="app-header">
          <div class="header-left">
            <h1 id="welcome-text">Welcome!</h1>
            <p class="header-datetime" id="header-datetime"></p>
          </div>
          <button class="btn-icon" onclick="doLogout()" title="Logout">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>

        <div class="add-row">
          <input
            class="add-input"
            id="new-title"
            type="text"
            placeholder="Add new task"
          />
          <button class="btn-add" onclick="doAdd()" title="Add task">+</button>
        </div>

        <div class="add-extras">
          <div>
            <label>Priority</label>
            <select id="new-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div>
            <label>Due date</label>
            <input id="new-due" type="datetime-local" />
          </div>
          <div class="span-2">
            <label>Description</label>
            <input id="new-desc" type="text" placeholder="Optional note…" />
          </div>
        </div>

        <div class="todos" id="todos">
          <div class="state-msg">Loading…</div>
        </div>
        <p class="err" id="todos-err"></p>

        <div class="app-footer">
          <p class="remaining" id="remaining"></p>
          <p class="quote" id="quote"></p>
        </div>
      </div>
    </div>

    <div class="config-bar">
      <button class="config-toggle" onclick="toggleConfig()">⚙ API</button>
      <div id="config-panel" class="config-panel hidden">
        <label>API base URL</label>
        <input
          id="api-base-input"
          type="text"
          placeholder="http://localhost:8000"
        />
        <button class="btn btn-primary" onclick="saveApiBase()">Save</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
